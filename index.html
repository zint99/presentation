<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container { max-width: 480px; width: 100%; padding: 2rem; }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: #f8fafc;
    }
    .list { display: flex; flex-direction: column; gap: 0.75rem; }
    a {
      display: block;
      padding: 1rem 1.25rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #93c5fd;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.15s, border-color 0.15s;
    }
    a:hover {
      background: #334155;
      border-color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Presentations</h1>
    <div class="list">
      <a href="./transformer-demo/">Transformer Demo</a>
    </div>
  </div>
</body>
</html>
